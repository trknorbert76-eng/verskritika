
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Szonettkoszorú szerkesztő</title>
<style>
body{font-family:Segoe UI,Arial;background:#eef2f5;margin:20px}
h1{margin-bottom:15px}
.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.12);margin-bottom:18px}
.header,.row{display:grid;grid-template-columns:40px 700px 60px 70px;gap:10px;align-items:center}
.header{font-weight:bold;color:#444;border-bottom:2px solid #bbb;padding-bottom:6px;margin-bottom:6px}
.row{margin:3px 0}
.num{text-align:right;font-weight:bold;color:#666}
.line{
 width:690px;
 border:none;
 border-bottom:1px solid #888;
 background:repeating-linear-gradient(to bottom,#fff 0,#fff 25px,#d7d7d7 26px);
 font-size:17px;
 padding:3px 6px;
 height:28px;
}
.fixed{background:#ececec}
.sep{border-top:1px dashed #999;margin:10px 0}
.center{text-align:center}
.good{color:green;font-weight:bold}
.bad{color:#d00000;font-weight:bold}
details{margin-top:12px}
summary{font-size:18px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<h1>📖 Szonettkoszorú szerkesztő</h1>

<div class="card">
<h2>15. Mesterszonett</h2>
<div class="header">
<div>#</div><div>Sor</div><div class="center">Rím</div><div class="center">Szótag</div>
</div>
<div id="master"></div>
</div>

<div id="others"></div>

<script>
function syllables(t){
 t=t.toLowerCase().replace(/[^a-záéíóöőúüű]/g,"");
 return (t.match(/[aáeéiíoóöőuúüű]/g)||[]).length;
}
function count(txt){
 let s=0;
 txt.trim().split(/\s+/).forEach(w=>{if(w)s+=syllables(w);});
 return s;
}
const master=document.getElementById("master");
const masterInputs=[];

function upd(inp,box){
 const n=count(inp.value);
 box.textContent=n;
 box.className="center "+((n==10||n==11)?"good":"bad");
}

function add(parent,no,fixed=false,idx=-1){
 let r=document.createElement("div");
 r.className="row";
 let a=document.createElement("div");a.className="num";a.textContent=no;
 let i=document.createElement("input");i.className="line"+(fixed?" fixed":"");
 let rhyme=document.createElement("div");rhyme.className="center";rhyme.textContent="";
 let syl=document.createElement("div");
 if(fixed){
   i.value=masterInputs[idx].value;
   masterInputs[idx].addEventListener("input",()=>{i.value=masterInputs[idx].value;upd(i,syl);});
 }
 i.oninput=()=>upd(i,syl);
 upd(i,syl);
 r.append(a,i,rhyme,syl);
 parent.appendChild(r);
 return i;
}
for(let x=1;x<=14;x++){
 masterInputs.push(add(master,x));
 if(x==4||x==8||x==11){
   let s=document.createElement("div");s.className="sep";master.appendChild(s);
 }
}
const oth=document.getElementById("others");
for(let n=1;n<=14;n++){
 let d=document.createElement("details");
 if(n==1)d.open=true;
 let sm=document.createElement("summary");
 sm.textContent=n+". szonett";
 d.appendChild(sm);
 let c=document.createElement("div");
 c.className="card";
 let h=document.createElement("div");
 h.className="header";
 h.innerHTML="<div>#</div><div>Sor</div><div class='center'>Rím</div><div class='center'>Szótag</div>";
 c.appendChild(h);
 for(let x=1;x<=14;x++){
   let f=false,id=-1;
   if(x==1){f=true;id=n-1;}
   if(x==14){f=true;id=n%14;}
   add(c,x,f,id);
   if(x==4||x==8||x==11){
      let s=document.createElement("div");s.className="sep";c.appendChild(s);
   }
 }
 d.appendChild(c);
 oth.appendChild(d);
}
</script>
</body>
</html>
