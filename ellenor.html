<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vers AI-detektor</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #eef2f7, #dde5ee);
  color: #1e293b;
  min-height: 100vh;
}

.page {
  max-width: 950px;
  margin: 0 auto;
  padding: 35px 18px 60px;
}

.header {
  text-align: center;
  margin-bottom: 28px;
}

.header h1 {
  margin: 0;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -1px;
}

.header p {
  margin-top: 8px;
  color: #64748b;
  font-size: 15px;
}

.card {
  background: white;
  border-radius: 18px;
  box-shadow: 0 12px 35px rgba(0,0,0,.08);
  padding: 25px;
  margin-bottom: 22px;
}

textarea {
  width: 100%;
  min-height: 340px;
  resize: vertical;
  border: 1px solid #cbd5e1;
  border-radius: 14px;
  padding: 18px;
  font-size: 17px;
  line-height: 1.6;
  outline: none;
  background: #f8fafc;
  transition: .2s;
}

textarea:focus {
  border-color: #475569;
  background: white;
  box-shadow: 0 0 0 3px rgba(71,85,105,.08);
}

.actions {
  display: flex;
  gap: 12px;
  margin-top: 16px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 21px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: .15s;
}

button:hover {
  transform: translateY(-1px);
}

.analyse {
  background: #0f172a;
  color: white;
}

.clear {
  background: #e2e8f0;
  color: #334155;
}

.results {
  display: none;
}

.result-title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 20px;
}

.signal {
  padding: 15px 0;
  border-bottom: 1px solid #e2e8f0;
}

.signal:last-child {
  border-bottom: none;
}

.signal-top {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  align-items: center;
  font-weight: 600;
}

.signal-points {
  white-space: nowrap;
  font-size: 16px;
}

.signal-desc {
  margin-top: 5px;
  font-size: 13px;
  color: #64748b;
}

.bar {
  height: 7px;
  background: #e2e8f0;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 8px;
}

.bar-fill {
  height: 100%;
  background: #64748b;
  border-radius: 10px;
}

.summary {
  margin-top: 26px;
  padding: 24px;
  border-radius: 16px;
  text-align: center;
  background: #f1f5f9;
}

.total-score {
  font-size: 44px;
  font-weight: 800;
  margin-bottom: 4px;
}

.total-label {
  color: #64748b;
  font-size: 14px;
}

.verdict {
  margin-top: 20px;
  font-size: 32px;
  font-weight: 800;
  padding: 15px;
  border-radius: 12px;
}

.verdict.ai {
  background: #fee2e2;
  color: #991b1b;
}

.verdict.human {
  background: #dcfce7;
  color: #166534;
}

.verdict.uncertain {
  background: #fef3c7;
  color: #92400e;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 20px;
}

.stat {
  background: #f8fafc;
  border-radius: 10px;
  padding: 12px;
  text-align: center;
}

.stat strong {
  display: block;
  font-size: 19px;
}

.stat span {
  color: #64748b;
  font-size: 12px;
}

.note {
  font-size: 12px;
  color: #94a3b8;
  margin-top: 18px;
  text-align: center;
}

@media (max-width: 650px) {
  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .signal-top {
    align-items: flex-start;
  }

  .header h1 {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="header">
    <h1>Vers AI-detektor</h1>
    <p>Helyi, szabályalapú kísérleti elemző · nincs API · nincs internet</p>
  </div>

  <div class="card">
    <textarea id="poem" placeholder="Másold ide a verset..."></textarea>

    <div class="actions">
      <button class="analyse" onclick="analysePoem()">Elemzés</button>
      <button class="clear" onclick="clearAll()">Törlés</button>
    </div>
  </div>

  <div class="card results" id="results">

    <div class="result-title">Elemzési jelek</div>

    <div id="signals"></div>

    <div class="stats">
      <div class="stat">
        <strong id="lineCount">0</strong>
        <span>sor</span>
      </div>

      <div class="stat">
        <strong id="wordCount">0</strong>
        <span>szó</span>
      </div>

      <div class="stat">
        <strong id="avgLine">0</strong>
        <span>átlag szó / sor</span>
      </div>

      <div class="stat">
        <strong id="uniqueRatio">0%</strong>
        <span>egyedi szavak</span>
      </div>
    </div>

    <div class="summary">

      <div class="total-score" id="score">0</div>
      <div class="total-label">AI-pont / 100</div>

      <div class="verdict" id="verdict"></div>

    </div>

    <div class="note">
      Kísérleti stilometriai becslés. Nem bizonyítja a szerzőséget.
    </div>

  </div>

</div>

<script>

function cleanWord(word) {
  return word
    .toLowerCase()
    .replace(/[.,!?;:„”"()\-–—…]/g, "")
    .trim();
}

function average(arr) {
  if (!arr.length) return 0;
  return arr.reduce((a,b) => a+b, 0) / arr.length;
}

function stdDev(arr) {
  if (!arr.length) return 0;
  const avg = average(arr);
  const variance =
    arr.reduce((sum, value) => sum + Math.pow(value - avg, 2), 0)
    / arr.length;

  return Math.sqrt(variance);
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function addSignal(name, points, maxPoints, description) {

  const percent = maxPoints === 0
    ? 0
    : Math.round((points / maxPoints) * 100);

  const html = `
    <div class="signal">
      <div class="signal-top">
        <div>${name}</div>
        <div class="signal-points">+${points} / ${maxPoints}</div>
      </div>

      <div class="signal-desc">${description}</div>

      <div class="bar">
        <div class="bar-fill" style="width:${percent}%"></div>
      </div>
    </div>
  `;

  document.getElementById("signals")
    .insertAdjacentHTML("beforeend", html);
}

function analysePoem() {

  const text = document.getElementById("poem").value.trim();

  if (!text) {
    alert("Másolj be előbb egy verset.");
    return;
  }

  const rawLines = text.split(/\n/);

  const lines = rawLines
    .map(x => x.trim())
    .filter(x => x.length > 0);

  const words = text
    .split(/\s+/)
    .map(cleanWord)
    .filter(Boolean);

  if (words.length < 10) {
    alert("Túl rövid szöveg az elemzéshez.");
    return;
  }

  document.getElementById("signals").innerHTML = "";

  let score = 0;

  // ----------------------------------------
  // 1. Rövid sorok
  // ----------------------------------------

  const lineWordCounts = lines.map(line =>
    line.split(/\s+/).filter(Boolean).length
  );

  const veryShortLines =
    lineWordCounts.filter(n => n <= 3).length;

  const shortRatio =
    veryShortLines / lines.length;

  let points = 0;

  if (shortRatio >= 0.40) points = 12;
  else if (shortRatio >= 0.30) points = 9;
  else if (shortRatio >= 0.20) points = 6;
  else if (shortRatio >= 0.10) points = 3;

  score += points;

  addSignal(
    "Rövid sorok aránya",
    points,
    12,
    Math.round(shortRatio * 100) +
    "% háromszavas vagy rövidebb sor."
  );

  // ----------------------------------------
  // 2. Sorhossz szabályossága
  // ----------------------------------------

  const deviation = stdDev(lineWordCounts);

  points = 0;

  if (deviation < 1.8) points = 12;
  else if (deviation < 2.5) points = 9;
  else if (deviation < 3.3) points = 5;
  else if (deviation < 4.0) points = 2;

  score += points;

  addSignal(
    "Sorhossz szabályossága",
    points,
    12,
    "Sorhossz szórása: " + deviation.toFixed(2)
  );

  // ----------------------------------------
  // 3. Szókincsváltozatosság
  // ----------------------------------------

  const uniqueWords =
    new Set(words);

  const uniqueWordRatio =
    uniqueWords.size / words.length;

  points = 0;

  if (uniqueWordRatio < 0.48) points = 13;
  else if (uniqueWordRatio < 0.56) points = 9;
  else if (uniqueWordRatio < 0.64) points = 5;
  else if (uniqueWordRatio < 0.70) points = 2;

  score += points;

  addSignal(
    "Szókincsváltozatosság",
    points,
    13,
    Math.round(uniqueWordRatio * 100) +
    "% egyedi szó."
  );

  // ----------------------------------------
  // 4. Ismétlések
  // ----------------------------------------

  const counts = {};

  words.forEach(word => {
    if (word.length < 4) return;
    counts[word] = (counts[word] || 0) + 1;
  });

  const repeatedWords =
    Object.values(counts)
      .filter(count => count >= 3).length;

  points = clamp(repeatedWords * 2, 0, 10);

  score += points;

  addSignal(
    "Szóismétlési minta",
    points,
    10,
    repeatedWords +
    " tartalmi szó ismétlődik legalább háromszor."
  );

  // ----------------------------------------
  // 5. Tipikus kötőszavas indítás
  // ----------------------------------------

  const connectorRegex =
    /^(és|de|hogy|ahogy|mintha|majd|csak|mert|ha|amikor|míg|mikor|ne|nem)\b/i;

  const connectorLines =
    lines.filter(line =>
      connectorRegex.test(line)
    ).length;

  const connectorRatio =
    connectorLines / lines.length;

  points = 0;

  if (connectorRatio >= 0.35) points = 10;
  else if (connectorRatio >= 0.25) points = 8;
  else if (connectorRatio >= 0.18) points = 5;
  else if (connectorRatio >= 0.10) points = 2;

  score += points;

  addSignal(
    "Kötőszavas sorindítások",
    points,
    10,
    Math.round(connectorRatio * 100) +
    "% ilyen sor."
  );

  // ----------------------------------------
  // 6. Generikus lírai szókészlet
  // ----------------------------------------

  const genericWords = new Set([
    "szív",
    "szívem",
    "lélek",
    "lelkem",
    "csend",
    "álom",
    "álmod",
    "álmok",
    "fény",
    "árnyék",
    "kéz",
    "kezed",
    "szem",
    "szemed",
    "könny",
    "csók",
    "hajnal",
    "éj",
    "éjjel",
    "emlék",
    "emléke",
    "vágy",
    "hiány",
    "szeretlek",
    "szerelem",
    "hold",
    "nap",
    "csillag",
    "út",
    "hazatér",
    "hazajön",
    "örökké",
    "pillanat",
    "perc",
    "idő"
  ]);

  const genericCount =
    words.filter(w =>
      genericWords.has(w)
    ).length;

  const genericRatio =
    genericCount / words.length;

  points = 0;

  if (genericRatio >= 0.12) points = 11;
  else if (genericRatio >= 0.08) points = 8;
  else if (genericRatio >= 0.05) points = 5;
  else if (genericRatio >= 0.03) points = 2;

  score += points;

  addSignal(
    "Generikus lírai szókészlet",
    points,
    11,
    genericCount +
    " gyakori lírai kulcsszó."
  );

  // ----------------------------------------
  // 7. AI-szerű retorikai szerkezetek
  // ----------------------------------------

  const patterns = [
    /\bmintha\b/gi,
    /\bahogy\b/gi,
    /\bmajd egyszer\b/gi,
    /\bne azért\b/gi,
    /\bcsak .* nem\b/gi,
    /\bhogy tudja\b/gi,
    /\bha majd\b/gi,
    /\bnem azért\b/gi,
    /\bmaradj még\b/gi
  ];

  let patternHits = 0;

  patterns.forEach(pattern => {
    const matches = text.match(pattern);
    if (matches) patternHits += matches.length;
  });

  points = clamp(patternHits * 3, 0, 12);

  score += points;

  addSignal(
    "Retorikai sablonok",
    points,
    12,
    patternHits +
    " tipikus szerkezeti találat."
  );

  // ----------------------------------------
  // 8. Nyomatéksorok
  // ----------------------------------------

  const emphasisLines =
    lines.filter(line => {

      const wc =
        line.split(/\s+/).length;

      return wc <= 4 &&
        /[.!?]$/.test(line);

    }).length;

  const emphasisRatio =
    emphasisLines / lines.length;

  points = 0;

  if (emphasisRatio >= 0.25) points = 10;
  else if (emphasisRatio >= 0.18) points = 7;
  else if (emphasisRatio >= 0.10) points = 4;
  else if (emphasisRatio >= 0.05) points = 2;

  score += points;

  addSignal(
    "Rövid nyomatéksorok",
    points,
    10,
    emphasisLines +
    " rövid, lezárt mondatsor."
  );

  // ----------------------------------------
  // 9. Prózavers / rímhiány
  // ----------------------------------------

  const endings = lines.map(line => {

    const w = line
      .split(/\s+/)
      .map(cleanWord)
      .filter(Boolean);

    return w.length
      ? w[w.length - 1].slice(-3)
      : "";

  });

  let rhymePairs = 0;

  for (let i = 0; i < endings.length; i++) {
    for (let j = i + 1; j < endings.length; j++) {
      if (
        endings[i].length >= 2 &&
        endings[i] === endings[j]
      ) {
        rhymePairs++;
      }
    }
  }

  if (rhymePairs === 0) points = 5;
  else if (rhymePairs <= 2) points = 3;
  else points = 0;

  score += points;

  addSignal(
    "Rímhiány / prózavers-jelleg",
    points,
    5,
    rhymePairs +
    " egyszerű sorvégi egyezés."
  );

  // ----------------------------------------
  // 10. Nagyon tiszta mondatszerkezet
  // ----------------------------------------

  const sentences =
    text
      .split(/[.!?]+/)
      .map(s => s.trim())
      .filter(Boolean);

  const sentenceLengths =
    sentences.map(s =>
      s.split(/\s+/).length
    );

  const sentenceDeviation =
    stdDev(sentenceLengths);

  points = 0;

  if (
    sentences.length >= 4 &&
    sentenceDeviation < 3
  ) {
    points = 5;
  } else if (
    sentences.length >= 4 &&
    sentenceDeviation < 5
  ) {
    points = 2;
  }

  score += points;

  addSignal(
    "Mondatszerkezet szabályossága",
    points,
    5,
    "Mondathossz szórása: " +
    sentenceDeviation.toFixed(2)
  );

  // ----------------------------------------
  // SCORE
  // ----------------------------------------

  score = clamp(Math.round(score), 0, 100);

  document.getElementById("score").textContent =
    score;

  document.getElementById("lineCount").textContent =
    lines.length;

  document.getElementById("wordCount").textContent =
    words.length;

  document.getElementById("avgLine").textContent =
    average(lineWordCounts).toFixed(1);

  document.getElementById("uniqueRatio").textContent =
    Math.round(uniqueWordRatio * 100) + "%";

  const verdict =
    document.getElementById("verdict");

  verdict.className = "verdict";

  /*
     Első tesztküszöbök.
     Ezeket majd a valódi tesztek alapján állítjuk.
  */

  if (score >= 60) {

    verdict.textContent = "AI";
    verdict.classList.add("ai");

  } else if (score >= 45) {

    verdict.textContent = "BIZONYTALAN";
    verdict.classList.add("uncertain");

  } else {

    verdict.textContent = "NEM AI";
    verdict.classList.add("human");

  }

  document.getElementById("results").style.display =
    "block";

  document.getElementById("results")
    .scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
}

function clearAll() {

  document.getElementById("poem").value = "";
  document.getElementById("results").style.display =
    "none";
  document.getElementById("signals").innerHTML = "";

}

</script>

</body>
</html>
